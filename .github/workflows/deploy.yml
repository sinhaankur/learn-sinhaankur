name: Deploy to Cloudflare Pages

# Builds the static export and deploys the whole out/ to Cloudflare Pages on every
# push to main — same reliable pipeline as the other subdomains (crossfit etc.),
# off the flaky dashboard integration.
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# And confirm the Pages project name below matches your project (default: learn-sinhaankur).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build static export
        run: pnpm build

      - name: Verify the learning pages built (guards a blank deploy)
        run: |
          test -f out/index.html || { echo "::error::home page missing from build"; exit 1; }
          test -f out/system/index.html || { echo "::error::/system page missing from build"; exit 1; }
          echo "built: home + /system ✓"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=learn-sinhaankur --branch=main
