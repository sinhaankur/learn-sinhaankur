name: Deploy to GitHub Pages

# Static Next.js export (output: "export") → GitHub Pages. Same proven host as
# sinhaankur.com. Every push to main builds out/ and publishes it. No Cloudflare,
# no project-type confusion — Pages just serves the static files.
#
# ONE-TIME SETUP: repo → Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build static export
        run: pnpm build

      - name: Verify the learning pages built (guards a blank deploy)
        run: |
          test -f out/index.html || { echo "::error::home page missing"; exit 1; }
          test -f out/system/index.html || { echo "::error::/system page missing"; exit 1; }
          echo "built: home + /system ✓"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
