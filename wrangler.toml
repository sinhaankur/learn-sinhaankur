# Pin this as a STATIC Cloudflare Pages site.
#
# Why: the dashboard auto-detected "Next.js" and tried to deploy via OpenNext
# (a server Worker), which crashed with ENOENT pages-manifest.json — because this
# app is a STATIC EXPORT (next.config.mjs: output: "export"), it has no server
# build. This config tells Cloudflare the truth: build `next build`, then just
# serve the exported `out/` folder as static assets. No OpenNext, no Worker.
name = "learn-sinhaankur"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"
